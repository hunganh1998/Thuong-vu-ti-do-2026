<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thương Vụ Tỷ Đô</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dfe8f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111f}}
:root[data-theme="dark"]{--bg:#0b111f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);display:grid;place-items:center}
canvas{touch-action:none;display:block;width:100%;max-width:calc(100vh*16/9);height:auto;aspect-ratio:16/9;image-rendering:pixelated}
#tc{display:none;position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#tc *{pointer-events:auto;touch-action:none}
#js{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff99}
#kn{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffcc;pointer-events:none}
#be,#ch button{border:2px solid #fff;background:#1f52b0dd;color:#fff;font:700 22px monospace}
#be{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%}
#ch{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:130px;display:none;flex-direction:column-reverse;gap:8px}
#ch button{width:64px;height:56px;border-radius:14px}
</style>
</head>
<body>
<canvas id="c" aria-label="Thế giới pixel art: Khu Tài Chính nối Khu Triệu Niềm Vui"></canvas>
<div id="tc"><div id="js"><i id="kn"></i></div><div id="ch"></div><button id="be">E</button></div>
<script>
/* ================= CONFIG (chỉnh scene ở đây) ================= */
const W=360,H=203;            // độ phân giải nội bộ
const BASE=156;               // chân các tòa nhà
const SW=158,CURB=172,ROAD=175; // vỉa hè / lề / mặt đường
const P={
  sky:['#2b78d4','#3a89de','#4f9be6','#69b0ec','#88c3f2','#a9d6f6'],
  green:['#25702f','#37963f','#5cba4c','#a4e06a','#174a22'] // tối, giữa, sáng, điểm sáng, viền
};
// Tòa nhà: đổi tên/màu/vị trí tại đây
const B=[
 {x:18,w:74,top:30,wall:'#24365a',dark:'#101a33',glass:'#3468a8',glass2:'#5b93cf',lit:'#f2c46b',
  py:34,ph:47,panel:'#16264a',logo:'tri',cw:10,ch:8,terr:[86,109],green:1,box:[6,14,5],
  lines:[['MEKONG',2,'#ffffff'],['CAPITAL',1,'#c9d6ee'],['INVESTING IN A',1,'#9fb4d8'],['SUSTAINABLE FUTURE',1,'#9fb4d8']],
  short:'MEKONG',sc:'#1c2c50',stc:'#fff'},
 {x:96,w:62,top:38,wall:'#dcd9d1',dark:'#7d8494',glass:'#3f7cbc',glass2:'#6ea6dc',lit:'#f2d08a',
  py:42,ph:42,panel:'#ecebe6',logo:'wing',cw:8,ch:9,terr:[118],green:1,box:[38,12,6],
  lines:[['ANGEL',2,'#1e2f6b'],['INVESTMENT',1,'#1e2f6b'],['BACKING GREAT',1,'#55607f'],['FOUNDERS',1,'#55607f']],
  short:'ANGEL',sc:'#e8e6df',stc:'#1e2f6b'},
 {x:168,w:56,top:27,wall:'#252e44',dark:'#0f1524',glass:'#31507f',glass2:'#4a6fa8',lit:'#f0c060',
  py:30,ph:40,panel:'#1b2338',logo:'bars',cw:7,ch:9,fin:[13,1,'#0f1524'],ant:40,box:[8,12,4],
  lines:[['TPG',3,'#ffffff'],['PRIVATE',1,'#c8d0e0'],['EQUITY FIRM',1,'#c8d0e0']],
  short:'TPG',sc:'#2b3448',stc:'#fff'},
 {x:228,w:52,top:52,wall:'#e5ddcc',dark:'#4a4438',glass:'#3f6fa6',glass2:'#7fa8d0',lit:'#e9b968',
  py:56,ph:32,panel:'#f1ebdd',logo:'scale',cw:6,ch:11,fin:[12,2,'#f2ead9'],flag:38,box:[6,10,4],green:1,
  lines:[['LEGACY',2,'#3a3324'],['LAW FIRM',1,'#3a3324']],
  short:'LEGACY',sc:'#e6dfcf',stc:'#3a3324'},
 {x:286,w:54,top:50,wall:'#1e3fae',dark:'#0f2270',glass:'#3f6fd0',glass2:'#7aa6ee',lit:'#f4d27a',
  py:54,ph:34,panel:'#1a3bb0',logo:'kpmg',cw:7,ch:9,flag:6,box:[30,12,4],
  lines:[['KPMG',2,'#ffffff'],['AUDIT TAX',1,'#dbe6ff'],['ADVISORY',1,'#dbe6ff']],
  short:'KPMG',sc:'#1a3bb0',stc:'#fff'}
];
// Nhà phố Việt Nam xen giữa: [x, đỉnh, rộng, màu tường, màu mái, seed]
const SHOPS=[[156,84,15,'#e2b25c','#8a3b2a',1],[278,96,13,'#e88f8f','#7a3a3a',2],[0,66,21,'#5eb1a8','#2f6f6a',3],[338,70,20,'#e8d6a0','#a6532f',4]];
// Cây: [x, chân, scale, seed]
const TREES=[[10,171,1.35,11],[62,168,.7,12],[98,171,1.15,13],[160,170,1,14],[236,171,1.1,15],[283,167,.65,16],[318,171,.95,17],[352,173,1.35,18]];
const LAMPS=[[25,172,84],[97,172,84],[279,172,84],[352,172,84]];
// Xe: [x, y(đáy bánh), loại, màu]
const VEH=[[112,171,'bike','#c9382f'],[124,171,'bike','#22262e'],[268,171,'bike','#2f6bd0']];

/* ================= UTILS ================= */
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const WINS=[],FLAGS=[];let g=buf.getContext('2d');g.imageSmoothingEnabled=false;
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))};
const px=(x,y,c)=>R(x,y,1,1,c);
let _s=1;const S=n=>{_s=n};                       // seed cố định => scene ổn định
const rnd=()=>{_s=(_s+0x6D2B79F5)|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const disc=(cx,cy,r,c)=>{for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r+r*.6-y*y));R(cx-w,cy+y,2*w+1,1,c)}};
const spr=(x,y,rows,cols)=>rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='0')px(x+i,y+j,cols[+ch-1])}));
const sh=(h,f)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(h.substr(i,2),16)*f))).toString(16).padStart(2,'0')).join('');

/* Font pixel 3x5 (mỗi chữ số = 1 hàng, hệ bát phân) + dấu tiếng Việt */
const F={A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',N:'65555',O:'25552',P:'65644',Q:'25563',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55775',X:'55255',Y:'55222',Z:'71247'};
Object.assign(F,{0:'75557',1:'26227',2:'61247',3:'61216',4:'55711',5:'74616',6:'34757',7:'71222',8:'75757',9:'75716','[':'64446',']':'31113','!':'22202','?':'61202','.':'00002',',':'00024',':':'02020','-':'00700','\u0110':'65556'});
function text(s,x,y,c,k=1){s=s.normalize('NFD');let cx=x,lx=x,cir=0;
  for(const ch of s){
    if(ch==='\u0302'){R(lx+k,y-2*k,k,k,c);cir=1;continue}
    if(ch==='\u0301'){R(lx+2*k,y-(2+cir)*k,k,k,c);continue}
    if(ch==='\u0300'){R(lx,y-(2+cir)*k,k,k,c);continue}
    if(ch==='\u0323'){R(lx+k,y+5*k,k,k,c);continue}if(ch==='\u0309'||ch==='\u0303'||ch==='\u0306'){R(lx+k,y-(2+cir)*k,k,k,c);continue}if(ch==='\u031B'){R(lx+3*k,y,k,k,c);continue}
    lx=cx;cir=0;const f=F[ch];
    if(f)for(let r=0;r<5;r++){const v=+f[r];for(let b=0;b<3;b++)if(v>>(2-b)&1)R(cx+b*k,y+r*k,k,k,c)}
    if(ch==='\u0110')R(cx-k,y+2*k,k,k,c);cx+=4*k}}
const tw=(s,k=1)=>(s.normalize('NFC').length*4-1)*k;
const textC=(s,cx,y,c,k=1)=>text(s,Math.round(cx-tw(s,k)/2),y,c,k);

/* ================= BACKGROUND ================= */
function drawSky(){const n=P.sky.length,bh=(BASE+4)/n;
  P.sky.forEach((c,i)=>{R(0,i*bh,W,bh+1,c);
    if(i){const y=Math.round(i*bh);for(let x=0;x<W;x+=2){px(x+(i%2),y-1,c);px(x+1-(i%2),y-2,c)}}})}
function drawCloud(x,y,s){const bl=[[0,0,7],[9,-3,9],[19,0,7],[27,1,5],[-7,2,4]];
  bl.forEach(([a,b,r])=>disc(x+a*s|0,y+b*s+3|0,r*s|0,'#b9d3ec'));
  bl.forEach(([a,b,r])=>disc(x+a*s|0,y+b*s|0,r*s|0,'#e3effa'));
  bl.forEach(([a,b,r])=>disc(x+a*s-1|0,y+b*s-2|0,Math.max(2,r*s-3)|0,'#ffffff'))}
function drawClouds(){[[42,20,1],[108,10,1.1],[212,14,1],[258,30,1.15],[330,46,.8]].forEach(c=>drawCloud(...c))}
function drawCity(sd=7){S(sd);
  [{c:'#9cc0e6',a:26,b:32},{c:'#86aedb',a:14,b:26}].forEach((L,li)=>{let x=-6;
    while(x<W){const w=12+rnd()*16|0,h=L.a+rnd()*L.b|0;R(x,BASE-h,w,h,L.c);R(x,BASE-h,1,h,sh(L.c,1.12));
      for(let y=BASE-h+3;y<BASE-4;y+=3)for(let xx=x+2;xx<x+w-1;xx+=3)if(rnd()<.35)px(xx,y,li?'#a9c8e8':'#b7d3ee');
      x+=w+(rnd()*3|0)}});
  R(0,38,18,BASE-38,'#8fb4de');R(0,38,18,2,'#b7d3ee');for(let y=42;y<BASE-4;y+=4)for(let x=2;x<16;x+=4)px(x,y,rnd()<.5?'#5f8fc9':'#c7ddf3');
  R(348,60,12,BASE-60,'#c9d6e6');for(let y=64;y<BASE-4;y+=4)for(let x=350;x<358;x+=3)px(x,y,'#7ea4d0')}

/* ================= BUILDINGS ================= */
function drawBush(x,y){disc(x,y-1,3,P.green[0]);disc(x-1,y-2,2,P.green[1]);px(x-1,y-3,P.green[3]);px(x+2,y-1,P.green[4])}
function drawFlag(x,y){R(x,y,1,15,'#c9ced8');px(x,y-1,'#f2d060');FLAGS.push([x,y])}
function drawWindows(b,x,y,w,h){ // lưới cửa sổ kính
  R(x,y,w,h,b.dark);
  for(let yy=y;yy+b.ch<=y+h;yy+=b.ch)for(let xx=x;xx+b.cw<=x+w-1;xx+=b.cw){
    const r=rnd(),c=r<.22?b.lit:r<.6?b.glass:b.glass2;
    if(c!==b.lit)WINS.push([xx+1,yy+1,b.cw-1,b.ch-2,b.lit]);R(xx+1,yy+1,b.cw-1,b.ch-2,c);R(xx+1,yy+1,b.cw-1,1,sh(c,1.28));
    if(c!==b.lit)R(xx+2,yy+3,2,1,sh(c,1.4));else R(xx+1,yy+b.ch-3,b.cw-1,1,sh(c,.8))}}
const SP={
  tri:{r:['000010000','000111000','001121100','011101110','111000111'],c:['#e0362c','#ff8a70']},
  wing:{r:['1100000000011','1111000001111','0111110111110','0011111111100','0001112111000','0000011100000'],c:['#2a4bb0','#f0b429']},
  scale:{r:['000010000','111111111','100010001','100010001','111010111','000010000','000010000','001111100'],c:['#3a3324']},
  bars:{r:['11111111','00000000','11111100','00000000','11111111'],c:['#ffffff']},
  kpmg:{r:['1'.repeat(30),'1'.repeat(30)],c:['#ffffff']}};
function drawLogoBlock(b,cx){const s=SP[b.logo];let tot=s.r.length+3;b.lines.forEach(l=>tot+=5*l[1]+2);tot-=2;
  let y=b.py+((b.ph-tot)>>1);spr(cx-(s.r[0].length>>1),y,s.r,s.c);y+=s.r.length+3;
  b.lines.forEach(([t,k,c])=>{textC(t,cx,y,c,k);y+=5*k+2})}
function drawBuilding(b,i){S(100+i*17);const{x,w,top}=b,cx=x+w/2|0,wb=130;
  R(x,top,w,BASE-top,b.wall);
  const rows=Math.floor((wb-(b.py+b.ph+3))/b.ch),y0=wb-rows*b.ch;
  drawWindows(b,x+2,y0,w-4,rows*b.ch);
  if(b.fin)for(let fx=x+2+b.fin[0];fx<x+w-3;fx+=b.fin[0]+b.fin[1])R(fx,y0,b.fin[1],rows*b.ch,b.fin[2]);
  R(x+1,b.py,w-2,b.ph,b.panel);R(x+1,b.py,w-2,1,sh(b.panel,1.2));R(x+1,b.py+b.ph-1,w-2,1,sh(b.panel,.75));
  drawLogoBlock(b,cx);
  (b.terr||[]).forEach(t=>{R(x,t+1,w,2,b.dark);for(let k=x+2;k<x+w-1;k+=5)drawBush(k,t+1)});
  R(x,top,1,BASE-top,sh(b.wall,1.25));R(x+w-1,top,1,BASE-top,sh(b.wall,.7));
  R(x-1,top-1,w+2,2,sh(b.wall,1.15));R(x-1,top+1,w+2,1,sh(b.wall,.7));
  if(b.box){const[dx,bw,bh]=b.box;R(x+dx,top-bh-1,bw,bh,b.dark);R(x+dx,top-bh-1,bw,1,sh(b.dark,2.2))}
  if(b.green)for(let k=x+3;k<x+w-2;k+=6)drawBush(k,top-1);
  if(b.ant!=null){R(x+b.ant,top-15,1,14,'#9aa4b8');px(x+b.ant,top-16,'#ff5a5a')}
  if(b.flag!=null)drawFlag(x+b.flag,top-15);
  // sảnh
  R(x+2,wb,w-4,26,b.dark);R(x+1,wb-2,w-2,3,sh(b.wall,.85));
  R(x+4,wb+4,w-8,21,'#e9a94b');R(x+4,wb+4,w-8,8,'#f4c777');
  for(let k=x+4;k<x+w-4;k+=8)R(k,wb+4,1,21,b.dark);
  for(let k=x+6;k<x+w-6;k+=5)R(k,wb+18,3,2,'#7a4a24');
  R(cx-4,wb+12,8,14,'#f8e0a4');R(cx,wb+12,1,14,b.dark)}
function drawShop(s){const[x,top,w,wall,roof,sd]=s;S(sd*31);
  R(x,top,w,BASE-top,wall);R(x,top,w,3,roof);R(x,top,w,1,sh(roof,1.3));R(x+w-1,top,1,BASE-top,sh(wall,.75));
  for(let y=top+6;y<BASE-17;y+=12){R(x+2,y,w-4,7,'#274a6b');if(rnd()<.55)R(x+3,y+1,w-6,3,'#f0c46a');R(x+2,y,w-4,1,'#6fa3cf');
    R(x+1,y+8,w-2,1,'#2a2323');R(x+1,y+9,w-2,2,sh(wall,.7))}
  R(x,BASE-14,w,14,'#33251f');R(x-1,BASE-15,w+2,3,sd%2?'#c0392b':'#e0a83a');R(x+2,BASE-10,w-4,10,'#f0b85a');
  R(x+2,top-4,5,4,'#4b83b8');R(x+2,top-5,5,1,'#8ab6dc');
  if(sd%2)drawFlag(x+w-3,top+8)}

/* ================= STREET ================= */
function drawSidewalk(){S(5);R(0,SW,W,CURB-SW,'#cfaa92');
  [[158,4,10],[162,5,14],[167,5,19]].forEach(([y,h,sp],r)=>{R(0,y,W,1,'#b48d78');
    for(let x=(r%2)*sp/2;x<W;x+=sp){R(x,y,1,h,'#b48d78');px(x+2,y+1,'#e2c0a8')}});
  for(let i=0;i<70;i++)R(rnd()*W,158+rnd()*13,2,1,rnd()<.5?'#c39c85':'#dbb8a0');
  R(0,CURB,W,2,'#b3b6be');R(0,CURB,W,1,'#d0d3da');R(0,CURB+2,W,1,'#5d616c');
  [44,150,214,300].forEach(x=>{R(x,CURB,9,2,'#2f333d');for(let i=0;i<9;i+=2)px(x+i,CURB,'#565b68')})}
function drawStreet(){S(9);R(0,ROAD,W,H-ROAD,'#454a58');
  for(let i=0;i<260;i++)R(rnd()*W,ROAD+rnd()*(H-ROAD),1+(rnd()*2|0),1,rnd()<.5?'#3a3f4b':'#515665');
  R(0,ROAD+1,W,1,'#d9b13a');
  for(let x=6;x<W;x+=46)R(x,192,24,2,'#d9d6c8');
  for(let i=0;i<6;i++)for(let y=181;y<H;y++)R(300+i*10-(y-181)*.35,y,5,1,'#e8e6dc')}
function drawPlaza(BB=B){R(0,BASE,W,2,'#7d828e');R(0,BASE,W,1,'#a3a8b3');S(21);
  for(let x=2;x<W;x+=5)if(!BB.some(b=>Math.abs(x-(b.x+b.w/2))<11&&x>b.x&&x<b.x+b.w))drawBush(x,BASE+2);
  for(let x=2;x<W;x+=9)if(rnd()<.35)px(x+rnd()*4|0,BASE-2,['#f3c2d4','#fff2a8','#ffffff'][rnd()*3|0]);
  BB.forEach(b=>{const cx=b.x+b.w/2|0;
    R(cx-10,BASE,20,2,'#c8c6bd');R(cx-12,BASE+2,24,2,'#b0aea6');R(cx-12,BASE+4,24,1,'#8f8d86');
    const t=tw(b.short)+6;R(b.x+2,BASE-7,t,9,b.sc);R(b.x+2,BASE-7,t,1,sh(b.sc,1.3));R(b.x+2,BASE+1,t,1,sh(b.sc,.6));textC(b.short,b.x+2+t/2,BASE-5,b.stc)});
  [[74,26],[150,24],[214,22],[268,24],[302,20]].forEach(([x,w])=>{R(x,BASE+4,w,5,'#8b8f99');R(x,BASE+4,w,1,'#b6bac4');R(x,BASE+8,w,1,'#5d616c');for(let k=x+2;k<x+w;k+=4)drawBush(k,BASE+5)})}

/* ================= PROPS ================= */
function canopy(bl,sd){S(sd);const d=P.green;
  bl.forEach(([a,c,r])=>disc(a+1,c+2,r,d[4]));
  bl.forEach(([a,c,r])=>disc(a,c,r,d[0]));
  bl.forEach(([a,c,r])=>disc(a-1,c-1,Math.max(2,r-2),d[1]));
  bl.forEach(([a,c,r])=>disc(a-2,c-3,Math.max(1,r-5),d[2]));
  bl.forEach(([a,c,r])=>{
    for(let i=0;i<r*1.4;i++){const t=Math.PI+rnd()*Math.PI*.9,q=r*(.55+rnd()*.5);px(a+Math.cos(t)*q,c+Math.sin(t)*q,d[3])}
    for(let i=0;i<r;i++){const t=rnd()*Math.PI*.9,q=r*(.5+rnd()*.5);px(a+Math.cos(t)*q,c+Math.sin(t)*q,d[4])}})}
function drawTree(x,b,s,sd){S(sd);const th=Math.round(20*s),cr=Math.round(13*s);
  R(x-1,b-th,3,th,'#4a3324');R(x-1,b-th,1,th,'#6d4a33');R(x+1,b-th,1,th,'#33231a');R(x-3,b-1,7,1,'#33231a');
  const cy=b-th-cr+3,bl=[];S(sd+1);
  for(let i=0;i<8;i++)bl.push([Math.round(x+(rnd()-.5)*cr*2.3),Math.round(cy+(rnd()-.5)*cr*1.5),Math.round(cr*(.5+rnd()*.35))]);
  bl.push([x,cy,cr]);canopy(bl,sd+2)}

Object.assign(Game.prototype,{
  setMap(k){const m=MAPS[k];this.map=m;this.col=m.col;this.npcs=m.npcs;this.toast={s:m.title,t:0}},
  edge(){const p=this.player,m=this.map;
    if(this.pan){const a=this.pan;if(a.t<.6)return;
      p.x=a.d>0?Math.max(10,p.x-W):Math.min(350,p.x+W);this.pan=null;this.setMap(a.to);return}
    if(this.dlg.on)return;const r=m.next.right,l=m.next.left;
    if(r&&p.x>=352&&p.vx>0)this.pan={to:r,d:1,t:0,from:m.key};
    else if(l&&p.x<=8&&p.vx<0)this.pan={to:l,d:-1,t:0,from:m.key};
    if(this.pan)this.col=FREE},
  update(dt){const p=this.player;
    if(this.pan){this.pan.t+=dt;p.vx=this.pan.d*Math.max(Math.abs(p.vx),34);p.dir=this.pan.d>0?'right':'left'} // tiếp tục bước, không dừng
    p.update(dt,this);this.edge();
    for(const k in MAPS){const m=MAPS[k];m.npcs.forEach(n=>n.update(dt,this));
      trafStep(m.traffic,dt);
      m.com.forEach(c=>c.update(dt));stepP(m.part,dt,this.time)}
    this.inter.update(this);this.dlg.update(dt,this);if(this.toast&&(this.toast.t+=dt)>3)this.toast=null},
  renderMap(m,ox,pl){const t=this.time,p=this.player;g.save();g.translate(ox,0);
    g.drawImage(m.L.sky,0,0);m.clouds.forEach(([x,y,s,v])=>drawCloud((x+t*v)%(W+80)-40,y,s));
    g.drawImage(m.L.town,0,0);

    m.flags.forEach(([x,y])=>flagCloth(x,y,t));
    const ents=m.static.concat(m.traffic.map(trafV),m.npcs.map(n=>({y:n.y,d:()=>n.draw()})),m.com.map(c=>({y:c.y,d:()=>c.draw()})),pl?[{y:p.y,d:()=>p.draw()}]:[]);
    ents.sort((a,b)=>a.y-b.y);ents.forEach(e=>e.d());                                  // Y-sorting
    g.drawImage(m.L.wire,0,0);swayBlit(m.L.fg,0,0,t,1.2,0,1e9);m.fx(t);
    g.globalAlpha=.75;m.part.forEach(q=>px(q.x,q.y,q.leaf?'#5cba4c':'#fff7cc'));g.globalAlpha=1;g.restore()},
  render(){const t=this.time,p=this.player,a=this.pan;
    if(a){const e=Math.min(1,a.t/.6),off=Math.round(e*e*(3-2*e)*W);      // camera trượt mượt, quantize theo pixel
      this.renderMap(MAPS[a.to],a.d*(W-off),false);this.renderMap(MAPS[a.from],-a.d*off,true)}
    else this.renderMap(this.map,0,true);

    if(t<8&&!this.dlg.on){text(CFG.hint,7,7,'#0e1730');text(CFG.hint,6,6,'#ffffff')}
    if(this.toast&&!a){const q=this.toast,s=q.s,w=tw(s)+12;g.globalAlpha=Math.max(0,Math.min(1,q.t*4,(3-q.t)*2));

    if(this.debug)this.drawDebug()}
});
InteractionManager.prototype.update=function(G){G.target=null;if(G.dlg.on||G.pan)return;const p=G.player,m=G.map;let best=null,bd=1e9;
  m.npcs.forEach(n=>{if(!n.talk)return;const d=Math.hypot(n.x-p.x,(n.y-p.y)*1.4);if(d<CFG.nearR&&d<bd){best={n};bd=d}});
  if(!best)m.B.forEach((b,i)=>{if(Math.abs(p.x-(b.x+b.w/2))<16&&p.y<=172)best={i}});G.target=best};
InteractionManager.prototype.press=function(G){if(G.dlg.on)return G.dlg.press(G);const t=G.target;if(!t)return;
  if(t.n){const k=TALKS[t.n.talk];G.dlg.open(G,{name:t.n.name,title:k.title,pages:k.pages,npc:t.n,topic:k.topic});return}
  const m=G.map,nm=m.names[t.i],hq=nm==='TRIỆU NIỀM VUI';
  G.dlg.open(G,{name:nm,title:hq?'TRỤ SỞ STARTUP':'CHƯA MỞ CỬA',npc:null,topic:'enter:'+m.key+':'+t.i,
    pages:[hq?'Đây là trụ sở Triệu niềm vui, nơi mọi ý tưởng bắt đầu. Bên trong sẽ mở ở phiên bản sau.':'Tòa nhà này chưa có bản đồ bên trong. Cửa sẽ mở ở phiên bản sau.']})};

    <title>Thương Vụ Tỷ Đô</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
    <style>
         :root {
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            --bg: #e2ecf5;
            --ff: 'VT323', 'Consolas', 'Menlo', 'DejaVu Sans Mono', 'Courier New', monospace
        }

        @media (prefers-color-scheme:dark) {
             :root:not([data-theme="light"]) {
                --bg: #0d1424
            }
        }

         :root[data-theme="dark"] {
            --bg: #0d1424
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            height: 100%
        }

        body {
            margin: 0;
            overscroll-behavior: none;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            height: 100%;
            background: var(--bg);
            display: grid;
            place-items: center;
            font-family: var(--ff)
        }

        canvas {
            touch-action: none;
            display: block;
            width: 100%;
            max-width: calc(100vh*16/9);
            height: auto;
            aspect-ratio: 16/9;
            image-rendering: pixelated
        }

        #tc {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none
        }

        #tc * {
            pointer-events: auto;
            touch-action: none
        }

        #js {
            position: absolute;
            left: max(18px, env(safe-area-inset-left));
            bottom: max(18px, env(safe-area-inset-bottom));
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ffffff33;
            border: 2px solid #ffffff99
        }

        #kn {
            position: absolute;
            left: 35px;
            top: 35px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #ffffffcc;
            pointer-events: none
        }

        #be,
        #ch button {
            border: 2px solid #fff;
            background: #1f52b0dd;
            color: #fff;
            font: 400 25px var(--ff)
        }

        #be {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            bottom: max(20px, env(safe-area-inset-bottom));
            width: 90px;
            height: 90px;
            border-radius: 50%
        }

        #ch {
            position: absolute;
            right: max(20px, env(safe-area-inset-right));
            bottom: 130px;
            display: none;
            flex-direction: column-reverse;
            gap: 8px
        }

        #ch button {
            width: 64px;
            height: 56px;
            border-radius: 14px
        }

        #au {
            position: fixed;
            top: 34px;
            right: 8px;
            z-index: 9;
            background: #1f52b0dd;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 2px 6px;
            font: 400 13px var(--ff);
            cursor: pointer;
            user-select: none
        }

        #au.off {
            background: #7a2a2add
        }

        #be,
        #ch button,
        #au {
            box-shadow: 0 3px 0 #0a1f4a, 0 0 12px #0006;
            transition: transform .08s, background .1s
        }

        #be:active,
        #ch button:active,
        #au:active {
            transform: translateY(2px) scale(.94);
            background: #2f6bd0dd
        }

        #js {
            box-shadow: inset 0 0 16px #0004
        }

        #menu-btn {
            position: fixed;
            top: 34px;
            right: 64px;
            z-index: 9;
            background: #1f52b0dd;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 8px;
            padding: 2px 6px;
            font: 400 13px var(--ff);
            cursor: pointer;
            user-select: none;
            box-shadow: 0 3px 0 #0a1f4a, 0 0 12px #0006
        }

        #menu-btn:active {
            transform: translateY(2px);
            background: #2f6bd0dd
        }

        #toasts {
            position: fixed;
            top: 58px;
            right: 8px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            max-width: 170px
        }

        .toast {
            background: linear-gradient(90deg, #f2c46b, #e8b058);
            color: #0e1730;
            padding: 3px 7px;
            border-radius: 5px;
            font: 400 12px var(--ff);
            border: 2px solid #fff;
            box-shadow: 0 3px 10px #0008;
            animation: tIn .35s cubic-bezier(.2, 1.4, .4, 1);
            line-height: 1.3
        }

        .toast.good {
            background: linear-gradient(90deg, #7fe08a, #5cba4c);
            color: #0a2810
        }

        .toast.bad {
            background: linear-gradient(90deg, #ff8a70, #e0362c);
            color: #fff
        }

        .toast small {
            font-weight: 400;
            opacity: .85
        }

        @keyframes tIn {
            from {
                transform: translateX(120%);
                opacity: 0
            }
            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        #menu {
            position: fixed;
            inset: 0;
            display: none;
            background: rgba(8, 14, 30, .95);
            z-index: 20;
            padding: 16px;
            overflow-y: auto;
            color: #fff;
            font: 400 16px var(--ff);
            backdrop-filter: blur(2px)
        }

        #menu.on {
            display: block;
            animation: mIn .25s
        }

        @keyframes mIn {
            from {
                opacity: 0;
                transform: scale(.98)
            }
            to {
                opacity: 1
            }
        }

        #menu h2 {
            color: #f2c46b;
            margin: 0 0 12px;
            font-size: 18px;
            border-bottom: 2px solid #2a4a8a;
            padding-bottom: 8px;
            padding-right: 44px
        }

        #menu h3 {
            color: #9fb4d8;
            margin: 14px 0 6px;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        #menu .card {
            background: rgba(26, 36, 68, .9);
            border: 2px solid #2a4a8a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            line-height: 1.5
        }

        #menu .btn {
            display: inline-block;
            background: #1f52b0;
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            padding: 8px 14px;
            font: 400 15px var(--ff);
            cursor: pointer;
            margin: 3px 3px 3px 0;
            user-select: none;
            transition: transform .08s, background .1s
        }

        #menu .btn:hover,
        #menu .btn:active {
            background: #2f6bd0;
            transform: translateY(-1px)
        }

        #menu .btn.g {
            background: #2a7a3a
        }

        #menu .btn.g:hover {
            background: #3a9a4a
        }

        #menu .btn.r {
            background: #8a2a2a
        }

        #menu .btn.r:hover {
            background: #a83a3a
        }

        #menu .close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #8a2a2a;
            border-color: #fff;
            width: 34px;
            height: 34px;
            padding: 0;
            text-align: center;
            line-height: 28px;
            font-size: 18px
        }

        .ach {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(42, 74, 138, .4)
        }

        .ach .ic {
            width: 34px;
            height: 34px;
            display: grid;
            place-items: center;
            background: #0e1730;
            border-radius: 6px;
            font-size: 19px;
            flex-shrink: 0
        }

        .ach.locked {
            opacity: .35;
            filter: grayscale(1)
        }

        .ach .nm {
            color: #f2c46b;
            font-weight: 700;
            font-size: 14px
        }

        .ach .ds {
            color: #9fb4d8;
            font-size: 12px;
            font-weight: 400;
            margin-top: 2px
        }

        .tut {
            position: fixed;
            left: 50%;
            bottom: 130px;
            transform: translateX(-50%);
            background: rgba(14, 23, 48, .96);
            border: 2px solid #f2c46b;
            border-radius: 8px;
            padding: 5px 9px;
            color: #fff;
            font: 400 13px var(--ff);
            max-width: 260px;
            z-index: 14;
            box-shadow: 0 4px 16px #0008;
            animation: tIn .3s;
            line-height: 1.5;
            pointer-events: none
        }

        .tut b {
            color: #f2c46b;
            display: block;
            margin-bottom: 2px;
            font-size: 12px
        }

        .tut .hint {
            color: #9fb4d8;
            font-size: 12px;
            margin-top: 4px;
            font-weight: 400
        }

        .tut .hint.close {
            color: #f2c46b
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid rgba(42, 74, 138, .3);
            font-size: 14px
        }

        .stats-row .k {
            color: #9fb4d8
        }

        .stats-row .v {
            color: #fff;
            font-weight: 700
        }

        @media (max-width:520px) {
            #toasts {
                top: 58px;
                max-width: 140px
            }
            .toast {
                font-size: 11px;
                padding: 2px 5px
            }
            #menu {
                font-size: 14px;
                padding: 12px
            }
            .tut {
                bottom: 150px;
                font-size: 13px;
                padding: 8px 10px;
                max-width: 280px
            }
        }
    @media print{html,body{display:none!important}}img,canvas{-webkit-user-drag:none;-webkit-touch-callout:none}
</style>
</head>

    <div id="menu"></div>

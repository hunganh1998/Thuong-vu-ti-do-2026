class Character{
  constructor(o){Object.assign(this,{x:0,y:0,dir:'down',state:'IDLE',t:0,frame:0,speed:CFG.npcSpeed,lock:0,busy:false,ai:null,name:'',talk:null,role:'passerby',near:false},o)}

  emote(s,d){this.set(s);this.lock=d}
  update(dt,G){this.t+=dt;this.frame=AnimationManager.frame(this.state,this.t);
    if(this.lock>0&&(this.lock-=dt)<=0&&!this.busy)this.set('IDLE');
    if(this.ai&&!this.busy&&this.lock<=0)this.ai.update(this,dt,G)}
  move(dx,dy,G){const a=(this.col||G.col).free(this.x+dx,this.y);if(a)this.x+=dx;const b=(this.col||G.col).free(this.x,this.y+dy);if(b)this.y+=dy;return a||b}

class Player extends Character{
  constructor(o){super(o);this.vx=this.vy=0}
  update(dt,G){const k=G.keys,ax=(k.right|0)-(k.left|0),ay=(k.down|0)-(k.up|0),busy=this.busy;let tx=0,ty=0;
    if(!busy&&(ax||ay)){const l=Math.hypot(ax,ay);tx=ax/l*CFG.speed;ty=ay/l*CFG.speed}
    const a=Math.min(1,dt*14);this.vx+=(tx-this.vx)*a;this.vy+=(ty-this.vy)*a;
    if(!tx&&Math.abs(this.vx)<1)this.vx=0;if(!ty&&Math.abs(this.vy)<1)this.vy=0;
    const mv=this.vx||this.vy;if(mv)this.move(this.vx*dt,this.vy*dt,G);
    if(!busy&&(ax||ay)){this.dir=ax&&Math.abs(ax)>=Math.abs(ay)?(ax<0?'left':'right'):(ay<0?'up':'down');this.lock=0}
    if(!busy&&this.lock<=0)this.set(mv?'WALK':'IDLE');
    super.update(dt,G)}
}

const DAY={ h:7.5, spd:0.04 };
function lerpC(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=(((A>>16)&255)+(((B>>16)&255)-((A>>16)&255))*t)|0;
  const g2=(((A>>8)&255)+(((B>>8)&255)-((A>>8)&255))*t)|0;
  const bl=((A&255)+((B&255)-(A&255))*t)|0;
  return '#'+((r<<16)|(g2<<8)|bl).toString(16).padStart(6,'0');}
function lighting(){
  const h=((DAY.h%24)+24)%24;
  if(h<4.5||h>=21.5) return { tint:'#0a1440', ta:.55, night:1, label:'ĐÊM' };
  if(h<6)   { const k=(h-4.5)/1.5; return { tint:lerpC('#0a1440','#ff6a40',k), ta:.55*(1-k)+.28*k, night:k<.5?1:0, label:'RẠNG ĐÔNG' }; }
  if(h<7)   { const k=h-6;         return { tint:lerpC('#ff6a40','#ffa060',k), ta:.28*(1-k)+.12*k, label:'BÌNH MINH' }; }
  if(h<9)   { const k=(h-7)/2;     return { tint:lerpC('#ffa060','#fff8d0',k), ta:.12*(1-k)+.03*k, label:'SÁNG' }; }
  if(h<16)  return { tint:'#fff8d0', ta:.03, label:'BAN NGÀY' };
  if(h<18)  { const k=(h-16)/2;    return { tint:lerpC('#fff8d0','#ff5a2a',k), ta:.03+.32*k, label:'CHIỀU' }; }
  if(h<19.5){ const k=(h-18)/1.5;  return { tint:lerpC('#ff5a2a','#2a3060',k), ta:.35+.15*k, label:'HOÀNG HÔN' }; }
  return { tint:'#0a1440', ta:.5, night:1, label:'TỐI' };
}

InteractionManager.prototype.update=function(G){G.target=null;if(G.dlg.on||G.pan)return;const p=G.player,m=G.map;let best=null,bd=1e9;
  m.npcs.forEach(n=>{if(!n.talk)return;const d=Math.hypot(n.x-p.x,(n.y-p.y)*1.4);
    n.near = d < CFG.nearR*1.6;
    if(d<CFG.nearR&&d<bd){best={n};bd=d}});
  if(!best)m.B.forEach((b,i)=>{if(Math.abs(p.x-(b.x+b.w/2))<16&&p.y<=172)best={i}});G.target=best};

function loanScore(k,type,purpose){const L=INVESTOR_OFFICES[k].loanCfg;const runway=CO.cash/CO.burn,mRev=CO.rev/12,mProf=mRev-CO.burn;
  let s=40;s+=Math.min(12,CO.months*.8);s+=Math.min(15,CO.rev*5);s+=Math.max(-8,Math.min(12,mProf*70));
  s+=Math.min(12,runway*1.4);s+=(CO.credit-50)*.3;s-=Math.min(20,CO.debt*5);
  s+=(CO.prep.fin?5:0)+(CO.prep.law?5:0)+(CO.prep.audit?4:0);
  if(type==='secured')s+=Math.min(18,collatVal()*6);else s-=8;
  s+=LPURPW[purpose]||0;return Math.round(s)}
function loanEval(k,type,amount,purpose){const L=INVESTOR_OFFICES[k].loanCfg,mRev=CO.rev/12,mProf=mRev-CO.burn,
  sc=loanScore(k,type,purpose),min=L.minScore[type],rate=L.rate[type],n=L.term,i=rate/100/12,
  A=i*Math.pow(1+i,n)/(Math.pow(1+i,n)-1);
  let cap=type==='secured'?Math.min(L.maxSecured,collatVal()*L.collatMult*1.3):Math.min(L.maxUnsecured,Math.max(.3,mRev*3));
  cap=Math.max(0,cap-CO.debt*.7);
  const maxPay=Math.max(0,mProf*.55),payCap=maxPay>0?maxPay/A:0;
  cap=Math.min(cap,payCap);
  const reasons=[];let status='approved',amt=amount;
  if(type==='secured'&&collatVal()<=0){status='rejected';amt=0;reasons.push('CHƯA CÓ TÀI SẢN ĐẢM BẢO')}
  else if(sc<min){status='rejected';amt=0;reasons.push('ĐIỂM TÍN DỤNG '+sc+'/'+min+': CHƯA ĐẠT')}
  else if(cap<amount){status='reduced';amt=r1(Math.max(.2,cap));reasons.push('SỐ TIỀN VƯỢT KHẢ NĂNG TRẢ NỢ');reasons.push('NGÂN HÀNG GIẢM CÒN '+amt+' TRIỆU USD')}
  else reasons.push('HỒ SƠ ĐẠT YÊU CẦU');
  if(status==='approved')reasons.push('NGÂN HÀNG CHẤP THUẬN '+amt+' TRIỆU USD');

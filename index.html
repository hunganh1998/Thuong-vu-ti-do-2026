<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Thương Vụ Tỷ Đô</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dfe8f5;--ff:'VT323','Consolas','Menlo','DejaVu Sans Mono','Courier New',monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b111f}}
:root[data-theme="dark"]{--bg:#0b111f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;overscroll-behavior:none;touch-action:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;height:100%;background:var(--bg);display:grid;place-items:center;font-family:var(--ff)}
canvas{touch-action:none;display:block;width:100%;max-width:calc(100vh*16/9);height:auto;aspect-ratio:16/9;image-rendering:pixelated}
#tc{display:none;position:fixed;inset:0;pointer-events:none;user-select:none;-webkit-user-select:none}
#tc *{pointer-events:auto;touch-action:none}
#js{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:120px;height:120px;border-radius:50%;background:#ffffff33;border:2px solid #ffffff99}
#kn{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffcc;pointer-events:none}
#be,#ch button{border:2px solid #fff;background:#1f52b0dd;color:#fff;font:400 25px var(--ff)}
#be{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:90px;height:90px;border-radius:50%}
#ch{position:absolute;right:max(20px,env(safe-area-inset-right));bottom:130px;display:none;flex-direction:column-reverse;gap:8px}
#ch button{width:64px;height:56px;border-radius:14px}
#au{position:fixed;top:34px;right:8px;z-index:9;background:#1f52b0dd;color:#fff;border:2px solid #fff;border-radius:8px;padding:2px 6px;font:400 13px var(--ff);cursor:pointer;user-select:none}
#au.off{background:#7a2a2add}
#be,#ch button,#au{box-shadow:0 3px 0 #0a1f4a,0 0 12px #0006;transition:transform .08s,background .1s}
#be:active,#ch button:active,#au:active{transform:translateY(2px) scale(.94);background:#2f6bd0dd}
#js{box-shadow:inset 0 0 16px #0004}
#menu-btn{position:fixed;top:34px;right:64px;z-index:9;background:#1f52b0dd;color:#fff;border:2px solid #fff;border-radius:8px;padding:2px 6px;font:400 13px var(--ff);cursor:pointer;user-select:none;box-shadow:0 3px 0 #0a1f4a,0 0 12px #0006}
#menu-btn:active{transform:translateY(2px);background:#2f6bd0dd}
#toasts{position:fixed;top:58px;right:8px;z-index:15;display:flex;flex-direction:column;gap:4px;pointer-events:none;max-width:170px}
.toast{background:linear-gradient(90deg,#f2c46b,#e8b058);color:#0e1730;padding:3px 7px;border-radius:5px;font:400 12px var(--ff);border:2px solid #fff;box-shadow:0 3px 10px #0008;animation:tIn .35s cubic-bezier(.2,1.4,.4,1);line-height:1.3}
.toast.good{background:linear-gradient(90deg,#7fe08a,#5cba4c);color:#0a2810}
.toast.bad{background:linear-gradient(90deg,#ff8a70,#e0362c);color:#fff}
.toast small{font-weight:400;opacity:.85}
@keyframes tIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
#menu{position:fixed;inset:0;display:none;background:rgba(8,14,30,.95);z-index:20;padding:16px;overflow-y:auto;color:#fff;font:400 16px var(--ff);backdrop-filter:blur(2px)}
#menu.on{display:block;animation:mIn .25s}
@keyframes mIn{from{opacity:0;transform:scale(.98)}to{opacity:1}}
#menu h2{color:#f2c46b;margin:0 0 12px;font-size:18px;border-bottom:2px solid #2a4a8a;padding-bottom:8px;padding-right:44px}
#menu h3{color:#9fb4d8;margin:14px 0 6px;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
#menu .card{background:rgba(26,36,68,.9);border:2px solid #2a4a8a;border-radius:8px;padding:10px;margin-bottom:8px;line-height:1.5}
#menu .btn{display:inline-block;background:#1f52b0;color:#fff;border:2px solid #fff;border-radius:6px;padding:8px 14px;font:400 15px var(--ff);cursor:pointer;margin:3px 3px 3px 0;user-select:none;transition:transform .08s,background .1s}
#menu .btn:hover,#menu .btn:active{background:#2f6bd0;transform:translateY(-1px)}
#menu .btn.g{background:#2a7a3a}
#menu .btn.g:hover{background:#3a9a4a}
#menu .btn.r{background:#8a2a2a}
#menu .btn.r:hover{background:#a83a3a}
#menu .close{position:absolute;top:12px;right:12px;background:#8a2a2a;border-color:#fff;width:34px;height:34px;padding:0;text-align:center;line-height:28px;font-size:18px}
.ach{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid rgba(42,74,138,.4)}
.ach .ic{width:34px;height:34px;display:grid;place-items:center;background:#0e1730;border-radius:6px;font-size:19px;flex-shrink:0}
.ach.locked{opacity:.35;filter:grayscale(1)}
.ach .nm{color:#f2c46b;font-weight:700;font-size:14px}
.ach .ds{color:#9fb4d8;font-size:12px;font-weight:400;margin-top:2px}
.tut{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(14,23,48,.96);border:2px solid #f2c46b;border-radius:8px;padding:5px 9px;color:#fff;font:400 13px var(--ff);max-width:260px;z-index:14;box-shadow:0 4px 16px #0008;animation:tIn .3s;line-height:1.5;pointer-events:none}
.tut b{color:#f2c46b;display:block;margin-bottom:2px;font-size:12px}
.tut .hint{color:#9fb4d8;font-size:12px;margin-top:4px;font-weight:400}
.tut .hint.close{color:#f2c46b}
.stats-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(42,74,138,.3);font-size:14px}
.stats-row .k{color:#9fb4d8}
.stats-row .v{color:#fff;font-weight:700}
@media (max-width:520px){
  #toasts{top:58px;max-width:140px}
  .toast{font-size:11px;padding:2px 5px}
  #menu{font-size:14px;padding:12px}
  .tut{bottom:150px;font-size:13px;padding:8px 10px;max-width:280px}
}
</style>
</head>
<body>

/* ================= UTILS ================= */

const buf=document.createElement('canvas');buf.width=W;buf.height=H;

let _s=1;const S=n=>{_s=n};
const rnd=()=>{_s=(_s+0x6D2B79F5)|0;let t=Math.imul(_s^_s>>>15,1|_s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const disc=(cx,cy,r,c)=>{for(let y=-r;y<=r;y++){const w=Math.floor(Math.sqrt(r*r+r*.6-y*y));R(cx-w,cy+y,2*w+1,1,c)}};
const spr=(x,y,rows,cols)=>rows.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch!=='0')px(x+i,y+j,cols[+ch-1])}));
const sh=(h,f)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(h.substr(i,2),16)*f))).toString(16).padStart(2,'0')).join('');

const F={A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',N:'65555',O:'25552',P:'65644',Q:'25563',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55775',X:'55255',Y:'55222',Z:'71247'};

const _nf={},TXC=new Map();function rawText(s,x,y,c,k=1){s=_nf[s]||(_nf[s]=s.toUpperCase().normalize('NFD'));let cx=x,lx=x,cir=0;

    if(ch==='\u0110')R(cx-k,y+2*k,k,k,c);cx+=4*k}}

  if(!e){if(TXC.size>900)TXC.clear();e=mk((s.normalize('NFD').length*4+3)*k,10*k);on(e,()=>rawText(s,k,4*k,c,k));TXC.set(id,e)}
  g.drawImage(e,Math.round(x)-k,Math.round(y)-4*k)}
const tw=(s,k=1)=>(s.normalize('NFC').length*4-1)*k;
const textC=(s,cx,y,c,k=1)=>text(s,Math.round(cx-tw(s,k)/2),y,c,k);

/* ===== CHỮ NÉT RÕ (VT323 + fallback), vẽ ở độ phân giải màn hình, giữ nguyên lưới 4px/ký tự ===== */
const TOC=new Map(),OVF="'VT323','Consolas','Menlo','DejaVu Sans Mono','Courier New',monospace";let FM=null;
function tCover(x,y,w,h){const a=g.globalAlpha;for(let i=TQ.length;i--;){const t=TQ[i];if(t.x>=x-1&&t.x+t.w<=x+w+1&&t.y-3*t.k>=y-1&&t.y+7*t.k<=y+h+1){if(a>.97)TQ.splice(i,1);else t.a*=1-a}}}
function tMetrics(){if(FM)return FM;const q=mk(8,8).getContext('2d');q.font='100px '+OVF;const m=q.measureText('H');return FM={cap:(m.actualBoundingBoxAscent||70)/100,adv:q.measureText('M').width/100}}
function tSprite(s,c,k,S){const id=s+'|'+c+'|'+k+'|'+S;let e=TOC.get(id);if(e)return e;if(TOC.size>700)TOC.clear();
  const ch=[...s.normalize('NFC')],u=k*S,cell=4*u,pad=Math.ceil(u*2),by=Math.round(10*u),M=tMetrics(),fs=5.4*u/M.cap,sx=Math.min(1,cell*.96/(M.adv*fs)),cv2=mk(Math.ceil(ch.length*cell+pad*2),Math.ceil(16*u)),q=cv2.getContext('2d');
  q.font=fs+'px '+OVF;q.textAlign='center';q.textBaseline='alphabetic';q.fillStyle=c;q.strokeStyle=c;q.lineJoin='round';q.lineWidth=Math.max(.6,fs*.045);
  ch.forEach((x,i)=>{if(x===' ')return;q.save();q.translate(pad+i*cell+cell/2,by);q.scale(sx,1);q.fillText(x,0,0);q.strokeText(x,0,0);q.restore()});
  return TOC.set(id,e={c:cv2,ox:pad,oy:by-Math.round(5*u)}),e}
function flushText(){if(!TQ.length)return;const S=cv.width/W;TQ.forEach(t=>{const e=tSprite(t.s,t.c,t.k,S);ctx.globalAlpha=t.a;ctx.drawImage(e.c,Math.round(t.x*S)-e.ox,Math.round(t.y*S)-e.oy)});ctx.globalAlpha=1;TQ.length=0}
try{document.fonts.load('20px VT323','Ạắữỳ').then(()=>{FM=null;TOC.clear()}).catch(()=>{})}catch(e){}

/* ================= BACKGROUND ================= */
function drawSky(){const n=P.sky.length,bh=(BASE+4)/n;
  P.sky.forEach((c,i)=>{R(0,i*bh,W,bh+1,c);
    if(i){const y=Math.round(i*bh);for(let x=0;x<W;x+=2){px(x+(i%2),y-1,c);px(x+1-(i%2),y-2,c)}}})}
const CLC={};function drawCloud(x,y,s){let c=CLC[s];if(!c){c=CLC[s]=mk(Math.ceil(60*s+20),Math.ceil(36*s+14));on(c,()=>cloudRaw(20,16,s))}g.drawImage(c,Math.floor(x)-20,Math.floor(y)-16)}
function cloudRaw(x,y,s){const bl=[[0,0,7],[9,-3,9],[19,0,7],[27,1,5],[-7,2,4]];
  bl.forEach(([a,b,r])=>disc(x+a*s|0,y+b*s+3|0,r*s|0,'#b9d3ec'));
  bl.forEach(([a,b,r])=>disc(x+a*s|0,y+b*s|0,r*s|0,'#e3effa'));
  bl.forEach(([a,b,r])=>disc(x+a*s-1|0,y+b*s-2|0,Math.max(2,r*s-3)|0,'#ffffff'))}
function drawCity(sd=7){S(sd);
  [{c:'#9cc0e6',a:26,b:32},{c:'#86aedb',a:14,b:26}].forEach((L,li)=>{let x=-6;
    while(x<W){const w=12+rnd()*16|0,h=L.a+rnd()*L.b|0;R(x,BASE-h,w,h,L.c);R(x,BASE-h,1,h,sh(L.c,1.12));
      for(let y=BASE-h+3;y<BASE-4;y+=3)for(let xx=x+2;xx<x+w-1;xx+=3)if(rnd()<.35)px(xx,y,li?'#a9c8e8':'#b7d3ee');
      x+=w+(rnd()*3|0)}});
  R(0,38,18,BASE-38,'#8fb4de');R(0,38,18,2,'#b7d3ee');for(let y=42;y<BASE-4;y+=4)for(let x=2;x<16;x+=4)px(x,y,rnd()<.5?'#5f8fc9':'#c7ddf3');
  R(348,60,12,BASE-60,'#c9d6e6');for(let y=64;y<BASE-4;y+=4)for(let x=350;x<358;x+=3)px(x,y,'#7ea4d0')}

/* dynamic sky: gradient theo giờ, mặt trời, mặt trăng, sao */
const SKYK=[[0,['#050a22','#08113a','#0d1c4c','#142a60','#1c3872','#27487f']],[4.5,['#0a1238','#141f52','#26306a','#3c3f7a','#58478a','#7a5a92']],
 [6,['#3b3f86','#6a4f93','#c0618a','#f0846a','#f8b078','#fcd6a0']],[7.5,P.sky],[16,P.sky],[17.5,['#2f5fb0','#5a6fc0','#b06aa6','#f08a5a','#f8ac5a','#fcd08a']],
 [19,['#1a2060','#3a2f78','#7a3f7e','#c4545a','#e8805a','#f4a870']],[20.5,['#08113a','#0d1c4c','#142a60','#1c3872','#27487f','#34548a']],[24,['#050a22','#08113a','#0d1c4c','#142a60','#1c3872','#27487f']]];
let SKY,skyK=-1;
function skyCols(h){let i=1;while(i<SKYK.length-1&&h>=SKYK[i][0])i++;const a=SKYK[i-1],b=SKYK[i],k=(h-a[0])/(b[0]-a[0]);return a[1].map((c,j)=>lerpC(c,b[1][j],k))}
function bakeSky(){SKY=SKY||mk();const h=((DAY.h%24)+24)%24,q=Math.round(h*20);if(q===skyK)return;skyK=q;
  on(SKY,()=>{const o=P.sky,c=P.sky=skyCols(h);drawSky();P.sky=o;
    const ns=h<5||h>=20?1:h<6?(6-h):h>=19?(h-19):0;
    if(ns>0){g.globalAlpha=ns;for(let i=0;i<46;i++)R((i*97+13)%W,(i*53+7)%95,1,1,i%5?'#9fb0e0':'#fff');g.globalAlpha=1}
    const arc=t=>[22+t*316,118-Math.sin(t*Math.PI)*100];
    if(h>5.5&&h<18.5){const[x,y]=arc((h-5.5)/13),w=h<7||h>17?'#ffb06a':'#fff3b0';g.globalAlpha=.25;disc(x,y,13,w);g.globalAlpha=.4;disc(x,y,10,w);g.globalAlpha=1;disc(x,y,7,w)}

const DAY={ h:7.5, spd:0.04 };
function lerpC(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);
  const r=(((A>>16)&255)+(((B>>16)&255)-((A>>16)&255))*t)|0;
  const g2=(((A>>8)&255)+(((B>>8)&255)-((A>>8)&255))*t)|0;
  const bl=((A&255)+((B&255)-(A&255))*t)|0;
  return '#'+((r<<16)|(g2<<8)|bl).toString(16).padStart(6,'0');}
function lighting(){
  const h=((DAY.h%24)+24)%24;
  if(h<4.5||h>=21.5) return { tint:'#0a1440', ta:.46, night:1, label:'ĐÊM' };
  if(h<6)   { const k=(h-4.5)/1.5; return { tint:lerpC('#0a1440','#ff6a40',k), ta:.46*(1-k)+.28*k, night:k<.5?1:0, label:'RẠNG ĐÔNG' }; }
  if(h<7)   { const k=h-6;         return { tint:lerpC('#ff6a40','#ffa060',k), ta:.28*(1-k)+.12*k, label:'BÌNH MINH' }; }
  if(h<9)   { const k=(h-7)/2;     return { tint:lerpC('#ffa060','#fff8d0',k), ta:.12*(1-k)+.03*k, label:'SÁNG' }; }
  if(h<16)  return { tint:'#fff8d0', ta:.03, label:'BAN NGÀY' };
  if(h<18)  { const k=(h-16)/2;    return { tint:lerpC('#fff8d0','#ff5a2a',k), ta:.03+.32*k, label:'CHIỀU' }; }
  if(h<19.5){ const k=(h-18)/1.5;  return { tint:lerpC('#ff5a2a','#2a3060',k), ta:.35+.15*k, label:'HOÀNG HÔN' }; }
  return { tint:'#0a1440', ta:.5, night:1, label:'TỐI' };
}

InteractionManager.prototype.update=function(G){G.target=null;if(G.dlg.on||G.pan)return;const p=G.player,m=G.map;let best=null,bd=1e9;
  m.npcs.forEach(n=>{if(!n.talk)return;const d=Math.hypot(n.x-p.x,(n.y-p.y)*1.4);
    n.near = d < CFG.nearR*1.6;
    if(d<CFG.nearR&&d<bd){best={n};bd=d}});
  if(!best)m.B.forEach((b,i)=>{if(Math.abs(p.x-(b.x+b.w/2))<16&&p.y<=172)best={i}});G.target=best};

const _pk=a=>a[Math.random()*a.length|0];
function genStartup(ex){
  const ks=Object.keys(IND).filter(x=>x!==ex),k=ks[Math.random()*ks.length|0],t=IND[k];
  const name=_pk(t.nm)+_pk(['Viet','Pro','X','Go','Hub','Lab']);
  const stage=['Seed','Series A','Series B'][Math.random()*3|0];
  const team=3+(Math.random()*17|0);
  const rev=Math.round((0.3+Math.random()*2.7)*10)/10;
  const cust=500+(Math.random()*8500|0);
  const burn=Math.round((rev/12*0.55+0.08+Math.random()*0.08)*100)/100;
  const runway=5+(Math.random()*10|0);
  const ask=Math.round(runway*burn*1.15*10)/10;
  const val=Math.round((rev*7+2+Math.random()*4)*10)/10;
  const eq=Math.round(ask/(val+ask)*1000)/10;
  return{k,name,prod:_pk(t.pr),prob:t.pb,rev_model:_pk(t.rv),
    metric:t.mt,risks:t.rk,gq:t.gq,stage,team,rev,cust,burn,runway,ask,val,eq,
    useFunds:[`50% phát triển ${_pk(t.pr)}`,`30% mở rộng thị trường`,`20% vận hành & dự phòng`],
    pitch:[
      `Chào nhà đầu tư. ${name} là ${_pk(t.pr)} phục vụ ${t.cu}.`,
      `Chúng tôi giải quyết vấn đề: ${t.pb}.`,
      `Hiện tại: doanh thu ${rev}M USD/năm, ${cust} khách, đội ${team} người, stage ${stage}.`,
      `Kế hoạch 12 tháng: mở rộng thị trường, tăng trưởng 3x.`,
      `Chúng tôi gọi ${ask}M USD cho ${runway} tháng runway (burn ${burn}M/tháng).`]};
}

 const LPQ=(m,k,lbl)=>{const x=ex(k),t=lp(m,x);return Z('ƯU ĐÃI THANH TOÁN',`Quỹ góp ${ask}M với ưu đãi ${m} lần có tham gia. Công ty bán ${x}M USD, quỹ nhận bao nhiêu?`,

function qBank(S){const b=qBank0(S),bad=/^(PHA LOÃNG CŨ|MÔ HÌNH|KHÁCH HÀNG|ĐỘI NGŨ|CẠNH TRANH|RỦI RO|M&A \/ THOÁI VỐN)$/,X=finQ(S);
  for(const k in b){b[k]=b[k].filter(q=>!bad.test(q.topic)&&!(k==='a'&&q.topic==='PHA LOÃNG')).concat(X[k]);b[k].forEach(q=>q.id=k+':'+q.topic)}return b}
